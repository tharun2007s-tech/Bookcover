<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Cover</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #090909;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Georgia', serif;
    }

    .book-cover {
      width: 400px;
      height: 600px;
      background: rgb(247, 5, 5);
      border: 2px solid #f7f6f6;
      padding: 40px 30px;
      box-shadow: 0 8px 20px rgba(27, 5, 167, 0.2);0.
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .title {
      font-size: 28px;
      font-weight: bold;
      color: #d9ff00;
      text-align: center;
      line-height: 1.3;
    }

    .subtitle {
      font-size: 16px;
      color:rgb(204, 255, 0)
      margin-top: 10px;
      text-align: center;
      font-style: italic;
    }

    .image {
      flex: 1;
      display: flex;
      justify-content: centre;
      align-items: center;
      background: url('book.jpg') center/contain no-repeat;
      margin: 30px 0;
    }

    .author {
      font-size: 18px;
      text-align: center;
      color: #000000;
      margin-top: 20px;
    }

    .line {
      height: 3px;
      background: #fdfcfc;
      width: 130px;
      margin: 10px auto;
    }
  </style>
</head>
<body>
  <div class="book-cover">
    <div>
      <div class="title"> Life of Pi </div>
      <div class="line"></div>
      <div class="subtitle"> Richard Parker - The Tiger </div>
    </div>
    <div class="image">
        <img src="">
    </div>
    <div class="author">By Yann Martel</div>
  </div>
</body>
</html>
